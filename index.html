<style>
:root{--blue:#1C4E80;--blue-d:#153B62;--blue-t:#E7EEF6;--green:#2E7D5B;--green-t:#E4F1EA;--orange:#E5732B;--orange-d:#C45C1B;--orange-t:#FBEBDD;--amber:#E8A23D;--amber-t:#FAF1DE;--red:#C34A3C;--red-t:#F8E8E5;--ink:#172A3A;--ink-deep:#0F1F2E;--ink-2:#31414F;--paper:#F7F4EE;--line:#E7E0D2;--muted:#68727B;--r:16px;--sh:0 10px 30px rgba(20,32,48,.08);--sh-s:0 1px 3px rgba(20,32,48,.07)}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{font-family:'Public Sans',sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}

.btn-b{background:var(--blue);color:#fff}.btn-b:hover{background:var(--blue-d)}
.btn-o{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn-o:hover{border-color:var(--ink-2)}

.btn-d{background:var(--red-t);color:var(--red)}.btn-gr{background:var(--green);color:#fff}

.btn-icon{width:38px;height:38px;padding:0;justify-content:center;border-radius:11px}

.b-red{background:var(--red-t);color:var(--red)}.b-gray{background:#EEEAE1;color:var(--ink-2)}.b-ink{background:var(--ink);color:#fff}

.card-pad{padding:22px}
.g{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}

.f-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:560px){.f-row{grid-template-columns:1fr}}

.sgg{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer}
.sgg:hover{background:var(--paper)}
.nsearch{position:relative}
.nsearch .input{width:210px;padding:9px 12px 9px 34px;border-radius:99px;font-size:13.5px}
.nsearch>.i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
@media(max-width:1080px){.nav-l,.nsearch.desk{display:none}.burger{display:flex!important}}
.burger{display:none}
.drawer{position:fixed;inset:0;z-index:90;display:none}.drawer.open{display:block}
.drawer-bg{position:absolute;inset:0;background:rgba(15,31,46,.5)}

.hlist{display:flex;gap:6px;flex-wrap:wrap}

.cat-card{border:1px solid var(--line);border-radius:var(--r);padding:22px;background:#fff;cursor:pointer;transition:.2s}

.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

.top{background:rgba(247,244,238,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:0 22px;height:64px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50}
.top h1{font-size:1.3rem}
.content{padding:22px;max-width:1140px}
.pagehead{margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}

</style>
</head>

}

/* ============ API layer ============ */
let session=null;
function loadSession(){try{session=JSON.parse(store.getItem('hfe_sess'))}catch(e){session=null}}
function setSession(u){session={userId:u.id};try{store.setItem('hfe_sess',JSON.stringify(session))}catch(e){}}
const me=()=>session?DB.users.find(u=>u.id===session.userId):null;
const myOrg=()=>{const u=me();return u&&u.orgId?DB.organizations.find(o=>o.id===u.orgId):null};
const orgById=id=>DB.organizations.find(o=>o.id===id);
const userById=id=>DB.users.find(u=>u.id===id);
function alog(action,entity){const u=me();DB.auditLogs.unshift({id:uid(),actor:u?u.name:'System',role:u?u.role:'SYSTEM',action:action,entity:entity,at:nowISO()})}
function notify(userId,title,message,icon){DB.notifications.unshift({id:uid(),userId:userId,title:title,message:message,icon:icon||'bell',read:false,at:nowISO()})}
function notifyOrg(orgId,title,message,icon){const ou=DB.users.find(x=>x.orgId===orgId);if(ou)notify(ou.id,title,message,icon)}
const API={
 login(email,pwRaw,role){const u=DB.users.find(x=>x.email.toLowerCase()===email.trim().toLowerCase());if(!u||u.password!==pw(pwRaw))throw'Invalid email or password.';if(role&&u.role!==role)throw'This account is registered as a '+ROLES[u.role]+'. Select the correct role.';if(u.status==='inactive')throw'Your account has been deactivated. Contact the HFE administrator.';const o=u.orgId&&orgById(u.orgId);if(o&&o.status==='inactive')throw'Your organization has been deactivated by the admin.';alog('Signed in',ROLES[u.role]);return u},
 register(d){if(DB.users.some(u=>u.email.toLowerCase()===d.email.toLowerCase()))throw'An account with this email already exists.';const u={id:uid(),role:'CITIZEN',name:d.name,email:d.email,password:pw(d.password),phone:d.phone,city:d.city,createdAt:nowISO(),savedOrgs:[]};DB.users.push(u);alog('Registered as citizen',d.email);notify(u.id,'Welcome to HFE','Your citizen account is ready. Explore services, events and campaigns near you.','sparkles');return u},
 createOrg(d,initPw){if(DB.users.some(u=>u.email.toLowerCase()===d.email.toLowerCase()))throw'Email already in use.';const id=uid();const org={id:id,type:d.type,name:d.name,email:d.email,phone:d.phone,city:d.city,address:d.address,lat:18.5204+(Math.random()-.5)*.2,lng:73.8567+(Math.random()-.5)*.2,description:d.description||'',services:[],facilities:[],areas:[],rating:0,ratingCount:0,status:'active',open:'08:00',close:'20:00',createdAt:nowISO()};DB.organizations.push(org);DB.users.push({id:uid(),role:d.type,name:d.name,email:d.email,password:pw(initPw),phone:d.phone,city:d.city,orgId:id,createdAt:nowISO(),savedOrgs:[]});alog('Created organization account',d.name);return{orgId:id,email:d.email,password:initPw}},
 updateOrg(id,d){Object.assign(orgById(id),d);alog('Updated organization profile',d.name)},
 setOrgStatus(id,st){const o=orgById(id);o.status=st;alog(st==='active'?'Activated organization':'Deactivated organization',o.name);notifyOrg(id,'Account '+(st==='active'?'activated':'deactivated'),st==='active'?'Your organization account is active again.':'Your account was deactivated by the admin.',st==='active'?'check':'alert-triangle')},
 resetOrgPw(id,npw){const u=DB.users.find(x=>x.orgId===id);u.password=pw(npw);alog('Reset organization password',u.email)},
 removeOrg(id){const o=orgById(id);DB.organizations=DB.organizations.filter(x=>x.id!==id);DB.users=DB.users.filter(u=>u.orgId!==id);DB.events=DB.events.filter(e=>e.orgId!==id);DB.campaigns=DB.campaigns.filter(c=>c.orgId!==id);DB.requirements=DB.requirements.filter(r=>r.orgId!==id);alog('Removed organization',o?o.name:id)},
 toggleUser(id){const u=userById(id);u.status=u.status==='inactive'?'active':'inactive';alog((u.status==='active'?'Activated':'Deactivated')+' user account',u.name)},
 donate(cid,amount,method,anon){const u=me();const c=DB.campaigns.find(x=>x.id===cid);const d={id:uid(),campaignId:cid,orgId:c.orgId,userId:u.id,name:u.name,amount:amount,method:method,txn:'HFE'+Date.now().toString().slice(-8),anonymous:anon,at:nowISO()};DB.donations.unshift(d);c.raised+=amount;c.donorCount=(c.donorCount||0)+1;alog('Submitted donation',inr(amount)+' → '+c.title);notify(u.id,'Donation confirmed','Your gift of '+inr(amount)+' to "'+c.title+'" was received. Thank you!','hand-coins');notifyOrg(c.orgId,'New donation received',u.name+' donated '+inr(amount)+' to "'+c.title+'".','hand-coins');notify('u1','Donation on platform',inr(amount)+' → "'+c.title+'"','hand-coins');return d},
 regEvent(eid){const u=me();const e=DB.events.find(x=>x.id===eid);if(DB.eventRegistrations.some(r=>r.eventId===eid&&r.userId===u.id))throw'You are already registered for this event.';const n=DB.eventRegistrations.filter(r=>r.eventId===eid).length;if(n>=e.seats)throw'This event is full.';DB.eventRegistrations.push({id:uid(),eventId:eid,userId:u.id,at:nowISO()});e.taken=n+1;alog('Registered for event',e.title);notifyOrg(e.orgId,'New event registration',u.name+' registered for "'+e.title+'".','users');notify(u.id,'Event registration confirmed','You are registered for "'+e.title+'" on '+fd(e.date)+'.','calendar-days')},
 cancelReg(eid){const u=me();DB.eventRegistrations=DB.eventRegistrations.filter(r=>!(r.eventId===eid&&r.userId===u.id));const e=DB.events.find(x=>x.id===eid);if(e)e.taken=Math.max(0,(e.taken||0)-1);alog('Cancelled event registration','')},
 createEvent(d){const o=myOrg();const e={id:uid(),orgId:o.id,title:d.title,type:d.type,date:d.date,time:d.time,location:d.location,seats:d.seats,description:d.description,taken:0,createdAt:nowISO()};DB.events.unshift(e);alog('Created event',d.title);notify('u1','New event published','"'+d.title+'" by '+o.name,'calendar-days')},
 delEvent(id){const e=DB.events.find(x=>x.id===id);DB.events=DB.events.filter(x=>x.id!==id);DB.eventRegistrations=DB.eventRegistrations.filter(r=>r.eventId!==id);alog('Deleted event',e?e.title:id)},
 createCampaign(d){const o=myOrg();DB.campaigns.unshift({id:uid(),orgId:o.id,title:d.title,category:d.category,target:d.target,description:d.description,donorCount:0,raised:0,createdAt:nowISO()});alog('Created donation campaign',d.title)},
 createVisit(orgId,d){const u=me();const o=orgById(orgId);const v={id:uid(),orgId:orgId,userId:u.id,name:u.name,email:u.email,phone:u.phone||'-',date:d.date,time:d.time,members:d.members,purpose:d.purpose,note:d.note,status:'pending',createdAt:nowISO()};DB.visitRequests.unshift(v);alog('Requested a visit',o.name);notifyOrg(orgId,'New visit request',u.name+' requested a visit on '+fd(d.date)+' at '+ft(d.time)+'.','calendar-check');notify('u1','New visit request',u.name+' → '+o.name,'calendar-check');notify(u.id,'Visit request submitted','Your visit request to '+o.name+' is pending review.','calendar-check')},
 setVisit(id,st,note){const v=DB.visitRequests.find(x=>x.id===id);v.status=st;if(note)v.note=note;const o=orgById(v.orgId);alog((st==='approved'?'Approved':'Rejected')+' visit request',v.name);notify(v.userId,'Visit request '+(st==='approved'?'approved':'rejected'),o.name+(st==='approved'?' approved your visit on '+fd(v.date)+'.':' could not approve your visit.'+(note?' Note: '+note:'')),'calendar-check')},
 createOpportunity(d){const o=myOrg();DB.volunteerOpportunities.unshift({id:uid(),orgId:o.id,title:d.title,needed:d.needed,skills:d.skills,schedule:d.schedule,description:d.description,status:'open',createdAt:nowISO()});alog('Created volunteer opportunity',d.title)},
 applyVolunteer(oid,d){const u=me();const v=DB.volunteerOpportunities.find(x=>x.id===oid);if(DB.volunteerApplications.some(a=>a.opportunityId===oid&&a.userId===u.id))throw'You have already applied for this opportunity.';DB.volunteerApplications.unshift({id:uid(),opportunityId:oid,orgId:v.orgId,userId:u.id,name:u.name,email:u.email,phone:u.phone||'-',availability:d.availability,skills:d.skills,message:d.message,status:'pending',createdAt:nowISO()});alog('Applied to volunteer',v.title);notifyOrg(v.orgId,'New volunteer application',u.name+' applied for "'+v.title+'".','heart-handshake');notify(u.id,'Volunteer application sent','Your application for "'+v.title+'" was sent to '+orgById(v.orgId).name+'.','heart-handshake')},

 submitFeedback(d){const u=me();DB.feedback.unshift({id:uid(),userId:u.id,orgId:d.orgId||null,category:d.category,rating:d.rating,message:d.message,fileName:d.fileName||null,status:'new',reply:null,createdAt:nowISO()});alog('Submitted feedback',d.category);if(d.orgId)notifyOrg(d.orgId,'New feedback received',u.name+' left a '+d.rating+'-star '+d.category.toLowerCase()+'.','message-square');else notify('u1','New feedback',u.name+' submitted '+d.category.toLowerCase()+' ('+d.rating+' stars).','message-square');notify(u.id,'Feedback submitted','Thank you for helping HFE improve.','message-square')},
 replyFeedback(id,reply){const f=DB.feedback.find(x=>x.id===id);f.reply=reply;f.status='resolved';alog('Replied to feedback',f.category);notify(f.userId,'Response to your feedback','"'+reply+'"','message-square')},
 submitRequirement(d){const o=myOrg();DB.requirements.unshift({id:uid(),orgId:o.id,item:d.item,category:d.category,qty:d.qty,urgency:d.urgency,note:d.note,status:'open',pledges:[],createdAt:nowISO()});alog('Published requirement',d.item)},
 pledge(reqId,d){const u=me();const r=DB.requirements.find(x=>x.id===reqId);r.pledges.push({name:u.name,qty:d.qty,note:d.note});alog('Pledged toward requirement',r.item);notifyOrg(r.orgId,'New pledge',u.name+' pledged '+d.qty+' x '+r.item+'.','package');notify(u.id,'Pledge recorded','Thank you! '+orgById(r.orgId).name+' will contact you about "'+r.item+'".','package')},

 eventCreate(){const o=myOrg();const min=isoLocal(new Date());modal(modalHead('Create event / camp')+'<div class="modal-b"><form onsubmit="return Act.eventSave(event)"><div class="field"><label class="lbl">Title</label><input class="input" id="e-title" required></div><div class="f-row"><div class="field"><label class="lbl">Type</label><select class="input" id="e-type">'+EV_TYPES[o.type].map(t=>'<option>'+t+'</option>').join('')+'</select></div><div class="field"><label class="lbl">Seats</label><input class="input" type="number" id="e-seats" min="5" value="50" required></div></div><div class="f-row"><div class="field"><label class="lbl">Date</label><input class="input" type="date" id="e-date" min="'+min+'" required></div><div class="field"><label class="lbl">Time</label><input class="input" type="time" id="e-time" value="10:00" required></div></div><div class="field"><label class="lbl">Location</label><input class="input" id="e-loc" value="'+h(o.address)+'" required></div><div class="field"><label class="lbl">Description</label><textarea class="input" id="e-desc" required></textarea></div><button class="btn btn-p" style="width:100%;justify-content:center">Publish event</button></form></div>',560)},
 eventSave(ev){ev.preventDefault();if(!vform(ev.target))return false;API.createEvent({title:$('#e-title').value,type:$('#e-type').value,date:$('#e-date').value,time:$('#e-time').value,location:$('#e-loc').value,seats:+$('#e-seats').value,description:$('#e-desc').value});save();closeModal();toast('Event published — it is live on the public site.');rerender();return false},
 eventDel(id){confirmBox({title:'Delete this event?',message:'All registrations for it will also be removed.',confirmText:'Delete',danger:true}).then(ok=>{if(ok){API.delEvent(id);save();toast('Event deleted.','info');rerender()}})},
 /* donations */
 dnOpen(cid){if(!me()){toast('Please sign in to donate — it keeps receipts tied to you.','info');location.hash='#/login';return}const c=DB.campaigns.find(x=>x.id===cid);const o=orgById(c.orgId);
  modal(modalHead('Donate — '+h(c.title))+'<div class="modal-b"><div class="mini" style="margin-bottom:12px"><i data-lucide="building-2" class="i-s"></i>'+h(o.name)+' · '+inr(c.raised)+' raised of '+inr(c.target)+'</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'+[100,500,1000,2500,5000].map(a=>'<span class="chip" onclick="Act.dnAmt('+a+')">₹'+a.toLocaleString('en-IN')+'</span>').join('')+'</div><div class="field"><label class="lbl">Amount (₹)</label><input class="input" id="dn-amt" type="number" min="10" value="500" required></div><div class="field"><label class="lbl">Payment method</label><div style="display:flex;gap:8px;flex-wrap:wrap" id="dn-methods">'+PaymentGateway.methods.map((m,i)=>'<span class="chip'+(i===0?' on':'')+'" data-m="'+m.id+'" onclick="Act.dnMethod(this)"><i data-lucide="'+m.icon+'" class="i-s"></i>'+m.label+'</span>').join('')+'</div></div><label class="check" style="margin-bottom:15px"><input type="checkbox" id="dn-anon"> Donate anonymously</label><button class="btn btn-p" style="width:100%;justify-content:center" onclick="Act.dnPay(\''+cid+'\')"><i data-lucide="lock" class="i"></i>Pay securely</button><p style="font-size:11.5px;color:var(--muted);text-align:center;margin-top:9px">Demo gateway — swap PaymentGateway with Razorpay/Stripe in production.</p></div>',540);window._dnMethod='upi'},
 dnAmt(a){$('#dn-amt').value=a},
 dnMethod(el){$$('#dn-methods .chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');window._dnMethod=el.dataset.m},
 dnPay:function(cid){const amt=parseFloat($('#dn-amt').value);if(!amt||amt<10){toast('Please enter a valid amount (min ₹10).','error');return}
  const method=window._dnMethod,anon=$('#dn-anon').checked;
  const m=modal(modalHead('Secure checkout')+'<div class="modal-b" style="text-align:center;padding:40px 24px"><div class="sk" style="width:54px;height:54px;border-radius:50%;margin:0 auto 16px"></div><b>Processing '+inr(amt)+' via '+method.toUpperCase()+'…</b><p style="font-size:13px;color:var(--muted);margin-top:5px">Contacting payment provider. Do not close this window.</p></div>',460);
  PaymentGateway.process(amt,method).then(()=>{const d=API.donate(cid,amt,method==='cash'?'Cash':method.charAt(0).toUpperCase()+method.slice(1),anon);save();rerender();m.el.querySelector('.modal-b').innerHTML='<div style="text-align:center;padding:12px 0"><div style="width:62px;height:62px;border-radius:50%;background:var(--green-t);display:inline-flex;align-items:center;justify-content:center"><i data-lucide="check-circle" style="width:30px;height:30px;color:var(--green)"></i></div><h3 style="margin:14px 0 5px">Donation successful</h3><p style="font-size:13.5px;color:var(--muted)">'+inr(amt)+' to "'+h(DB.campaigns.find(c=>c.id===cid).title)+'"<br>Txn ID: <b style="font-family:monospace">'+d.txn+'</b></p><div style="display:flex;gap:9px;justify-content:center;margin-top:18px"><button class="btn btn-o" onclick="Act.receipt(\''+d.id+'\');closeModal()"><i data-lucide="printer" class="i-s"></i>Receipt</button><button class="btn btn-p" onclick="closeModal()">Done</button></div></div>';icons()})},
 receipt(id){const d=DB.donations.find(x=>x.id===id);const c=DB.campaigns.find(x=>x.id===d.campaignId);const o=orgById(d.orgId);
  const w=window.open('','_blank','width=520,height=720');if(!w){toast('Please allow popups to print the receipt.','info');return}
  w.document.write('<html><head><title>Donation receipt '+d.txn+'</title><style>body{font-family:Georgia,serif;padding:36px;color:#172A3A}.hd{display:flex;justify-content:space-between;border-bottom:3px solid #E5732B;padding-bottom:14px}table{width:100%;border-collapse:collapse;margin-top:18px}td{padding:8px 0;border-bottom:1px solid #E7E0D2;font-size:14px}.amt{font-size:25px;font-weight:bold;color:#2E7D5B}.ft{margin-top:30px;font-size:11px;color:#68727B;text-align:center}</style></head><body><div class="hd"><div><h1 style="font-size:19px">HFE — Human Welfare Ecosystem</h1><p style="font-size:11px;color:#68727B">Connecting Humanity. Creating Hope.</p></div><div style="text-align:right;font-size:12px"><b>RECEIPT</b><br>'+d.txn+'</div></div><p style="margin-top:18px;font-size:13px">Thank you, <b>'+h(d.anonymous?'Anonymous Donor':d.name)+'</b>, for your kind contribution.</p><table><tr><td>Campaign</td><td align="right"><b>'+h(c.title)+'</b></td></tr><tr><td>Organization</td><td align="right">'+h(o.name)+'</td></tr><tr><td>Payment method</td><td align="right">'+d.method+'</td></tr><tr><td>Date</td><td align="right">'+new Date(d.at).toLocaleString('en-IN')+'</td></tr><tr><td>Amount</td><td align="right" class="amt">'+inr(d.amount)+'</td></tr></table><p style="margin-top:16px;font-size:12px;color:#68727B">System-generated receipt for a donation made via the HFE platform. 100% of the amount is passed to the beneficiary organization.</p><div class="ft">hfe.org · admin@hfe.org · 1800-000-HFE</div><scr'+'ipt>window.print()</scr'+'ipt></body></html>');w.document.close()},
 exportDon(){const rows=[['Txn','Donor','Campaign','Organization','Amount','Method','Date']].concat(DB.donations.map(d=>[d.txn,d.name,(DB.campaigns.find(c=>c.id===d.campaignId)||{}).title||'',(orgById(d.orgId)||{}).name||'',d.amount,d.method,d.at.slice(0,10)]));const s=rows.map(r=>r.map(v=>'"'+String(v).split('"').join('""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='hfe-donations.csv';a.click();toast('CSV exported.')},
 /* volunteering */
 applyVol(id){if(!me()){toast('Please sign in to apply.','info');location.hash='#/login';return}const v=DB.volunteerOpportunities.find(x=>x.id===id);
  modal(modalHead('Apply — '+h(v.title))+'<div class="modal-b"><form onsubmit="return Act.volSubmit(event,\''+id+'\')"><div class="f-row"><div class="field"><label class="lbl">Availability</label><select class="input" id="va-av"><option>Weekends</option><option>Weekday evenings</option><option>Weekday mornings</option><option>Flexible</option></select></div><div class="field"><label class="lbl">Skills</label><input class="input" id="va-sk" value="'+h(me().skills||'')+'" placeholder="e.g. Teaching, First aid"></div></div><div class="field"><label class="lbl">Why do you want to volunteer?</label><textarea class="input" id="va-msg" placeholder="A line or two helps organizations match you."></textarea></div><button class="btn btn-p" style="width:100%;justify-content:center"><i data-lucide="heart-handshake" class="i"></i>Submit application</button></form></div>',520)},

 oppCreate(){modal(modalHead('New volunteer opportunity')+'<div class="modal-b"><form onsubmit="return Act.oppSave(event)"><div class="field"><label class="lbl">Title</label><input class="input" id="vo-t" required></div><div class="f-row"><div class="field"><label class="lbl">Volunteers needed</label><input class="input" type="number" id="vo-n" min="1" value="10" required></div><div class="field"><label class="lbl">Schedule</label><input class="input" id="vo-s" placeholder="Sat-Sun, 10am-2pm" required></div></div><div class="field"><label class="lbl">Required skills (comma separated)</label><input class="input" id="vo-k" placeholder="Communication, First aid"></div><div class="field"><label class="lbl">Description</label><textarea class="input" id="vo-d" required></textarea></div><button class="btn btn-p" style="width:100%;justify-content:center">Publish opportunity</button></form></div>',540)},
 oppSave(ev){ev.preventDefault();if(!vform(ev.target))return false;API.createOpportunity({title:$('#vo-t').value,needed:+$('#vo-n').value,schedule:$('#vo-s').value,skills:$('#vo-k').value.split(',').map(s=>s.trim()).filter(Boolean),description:$('#vo-d').value});save();closeModal();toast('Opportunity published.');rerender();return false},
 oppClose(id){const v=DB.volunteerOpportunities.find(x=>x.id===id);v.status='closed';save();toast('Opportunity closed.','info');rerender()},
 appSet(id,st){if(st==='rejected'){confirmBox({title:'Reject this volunteer application?',message:'The applicant will be notified with the decision.',confirmText:'Reject',danger:true}).then(ok=>{if(ok){API.setApplication(id,'rejected');save();toast('Application rejected.','info');rerender()}})}else{API.setApplication(id,'accepted');save();toast('Volunteer accepted — they have been notified.');rerender()}},
 /* feedback */
 fbCat(v){$('#fb-org-w').style.display=(v==='Organization'||v==='Event'||v==='Service')?'block':'none'},
 fbStars(i){window._fbRate=i;$('#fb-rate').value=i;$('#fb-stars').innerHTML=stars(i,true);icons()},
 fbSubmit(ev){ev.preventDefault();if(!me()){toast('Please sign in to submit feedback.','info');location.hash='#/login';return false}const rate=parseInt($('#fb-rate').value)||0;if(!rate){toast('Please select a star rating.','error');return false}

 pfSave(ev){ev.preventDefault();if(!vform(ev.target))return false;API.updateProfile({name:$('#pf-name').value,phone:$('#pf-phone').value,city:$('#pf-city').value,blood:$('#pf-blood').value,address:$('#pf-addr').value,skills:$('#pf-skills').value});save();toast('Profile updated.');rerender();return false},

 opSave(ev){ev.preventDefault();if(!vform(ev.target))return false;const d={name:$('#op-name').value,phone:$('#op-phone').value,city:$('#op-city').value,address:$('#op-addr').value,open:$('#op-open').value,close:$('#op-close').value,description:$('#op-desc').value};

 /* admin orgs */
 admOrgAdd(){modal(modalHead('Add organization')+'<div class="modal-b"><form onsubmit="return Act.admOrgSave(event)"><div class="f-row"><div class="field"><label class="lbl">Type</label><select class="input" id="ao-type">'+Object.keys(TYPES).map(t=>'<option value="'+t+'">'+TYPES[t].label+'</option>').join('')+'</select></div><div class="field"><label class="lbl">Name</label><input class="input" id="ao-name" required></div></div><div class="f-row"><div class="field"><label class="lbl">Login email</label><input class="input" id="ao-email" type="email" required></div><div class="field"><label class="lbl">Initial password</label><input class="input" id="ao-pw" value="org@123" required minlength="6"></div></div><div class="f-row"><div class="field"><label class="lbl">Phone</label><input class="input" id="ao-phone" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10"  minlength="10" required></div><div class="field"><label class="lbl">City</label><input class="input" id="ao-city" value="Pune" required></div></div><div class="field"><label class="lbl">Address</label><input class="input" id="ao-addr" required></div><div class="field"><label class="lbl">Short description</label><textarea class="input" id="ao-desc"></textarea></div><button class="btn btn-p" style="width:100%;justify-content:center"><i data-lucide="building-2" class="i"></i>Create account & credentials</button></form></div>',560)},
 admOrgSave(ev){ev.preventDefault();if(!vform(ev.target))return false;try{const nmv=$('#ao-name').value;const res=API.createOrg({type:$('#ao-type').value,name:nmv,email:$('#ao-email').value,phone:$('#ao-phone').value,city:$('#ao-city').value,address:$('#ao-addr').value,description:$('#ao-desc').value},$('#ao-pw').value);save();closeModal();modal(modalHead('Organization created')+'<div class="modal-b"><div style="text-align:center;margin-bottom:14px"><i data-lucide="badge-check" style="width:44px;height:44px;color:var(--green)"></i><h3>'+h(nmv)+'</h3><p style="font-size:13px;color:var(--muted)">Share these credentials with the organization. Only the admin manages accounts.</p></div><div class="card card-pad" style="background:var(--paper);font-family:monospace;font-size:14px">Email: <b>'+h(res.email)+'</b><br>Password: <b>'+h(res.password)+'</b></div><button class="btn btn-b" style="margin-top:14px;width:100%;justify-content:center" onclick="closeModal()">Done</button></div>',480);rerender()}catch(e){toast(String(e),'error')}return false},
 admOrgEdit(id){const o=orgById(id);modal(modalHead('Edit — '+h(o.name))+'<div class="modal-b"><form onsubmit="return Act.admOrgEditSave(event,\''+id+'\')"><div class="f-row"><div class="field"><label class="lbl">Name</label><input class="input" id="oe-name" value="'+h(o.name)+'" required></div><div class="field"><label class="lbl">Phone</label><input class="input" id="oe-phone" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10"  minlength="10" value="'+h(o.phone)+'"></div></div><div class="f-row"><div class="field"><label class="lbl">City</label><input class="input" id="oe-city" value="'+h(o.city)+'"></div><div class="field"><label class="lbl">Address</label><input class="input" id="oe-addr" value="'+h(o.address)+'"></div></div><div class="field"><label class="lbl">Description</label><textarea class="input" id="oe-desc">'+h(o.description)+'</textarea></div><button class="btn btn-b" style="width:100%;justify-content:center">Save changes</button></form></div>',540)},
 admOrgEditSave(ev,id){ev.preventDefault();API.updateOrg(id,{name:$('#oe-name').value,phone:$('#oe-phone').value,city:$('#oe-city').value,address:$('#oe-addr').value,description:$('#oe-desc').value});const u=DB.users.find(x=>x.orgId===id);if(u)u.name=$('#oe-name').value;save();closeModal();toast('Organization updated.');rerender();return false},
 admOrgToggle(id){const o=orgById(id);const act=o.status==='active';confirmBox({title:(act?'Deactivate':'Activate')+' "'+h(o.name)+'"?',message:act?'The organization will be unable to log in until reactivated. Its public page will be hidden.':'The organization will regain full access.',confirmText:act?'Deactivate':'Activate',danger:act}).then(ok=>{if(ok){API.setOrgStatus(id,act?'inactive':'active');save();toast('Organization '+(act?'deactivated.':'activated.'));rerender()}})},

 admOrgRemove(id){const o=orgById(id);confirmBox({title:'Remove this organization?',message:'"'+h(o.name)+'" and its login account, events and campaigns will be permanently deleted. This cannot be undone.',confirmText:'Remove permanently',danger:true}).then(ok=>{if(ok){API.removeOrg(id);save();toast('Organization removed.','info');rerender()}})},
 admUserView(id){const u=userById(id);const dons=DB.donations.filter(d=>d.userId===id);modal(modalHead('Citizen — '+h(u.name))+'<div class="modal-b"><div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">'+avatar(u,52)+'<div><b>'+h(u.name)+'</b><div style="font-size:13px;color:var(--muted)">'+h(u.email)+' · '+h(u.phone||'-')+'</div></div></div><div class="g g3">'+statTile('hand-coins','#E4F1EA','#2E7D5B','Donated',inr(dons.reduce((s,d)=>s+d.amount,0)))+statTile('calendar-days','#E7EEF6','#1C4E80','Events',DB.eventRegistrations.filter(r=>r.userId===id).length)+statTile('heart','#F8E8E5','#C34A3C','Saved orgs',(u.savedOrgs||[]).length)+'</div><p style="font-size:12.5px;color:var(--muted);margin-top:12px">Joined '+fd(u.createdAt)+' · City: '+h(u.city||'-')+'</p></div>',500)},
 admUserToggle(id){const u=userById(id);confirmBox({title:(u.status==='inactive'?'Activate':'Deactivate')+' '+h(u.name)+'?',message:u.status==='inactive'?'The citizen will regain access.':'The citizen will be unable to sign in.',confirmText:u.status==='inactive'?'Activate':'Deactivate',danger:u.status!=='inactive'}).then(ok=>{if(ok){API.toggleUser(id);save();toast('User '+(u.status==='inactive'?'activated.':'deactivated.'));rerender()}})},
 annCreate(){modal(modalHead('New announcement')+'<div class="modal-b"><form onsubmit="return Act.annSave(event)"><div class="field"><label class="lbl">Title</label><input class="input" id="an-t" required></div><div class="field"><label class="lbl">Body</label><textarea class="input" id="an-b" required></textarea></div><button class="btn btn-p" style="width:100%;justify-content:center"><i data-lucide="megaphone" class="i"></i>Publish to all citizens</button></form></div>',520)},
 annSave(ev){ev.preventDefault();if(!vform(ev.target))return false;API.createAnnouncement({title:$('#an-t').value,body:$('#an-b').value});save();closeModal();toast('Announcement published.');rerender();return false},
 annDel(id){confirmBox({title:'Delete this announcement?',confirmText:'Delete',danger:true}).then(ok=>{if(ok){DB.announcements=DB.announcements.filter(a=>a.id!==id);save();toast('Announcement deleted.','info');rerender()}})},

 visitSet(id,st){API.setVisit(id,st);save();toast(st==='approved'?'Visit approved — the citizen has been notified.':'Visit marked completed.');rerender()},
 visitReject(id){promptBox({title:'Reject visit request',message:'Add a short reason — it is shared with the visitor.',label:'Reason',ok:'Reject request'}).then(v=>{if(v!==null){API.setVisit(id,'rejected',v||'');save();toast('Visit rejected.','info');rerender()}})},

 bloodClose(id){const b=DB.bloodRequests.find(x=>x.id===id);b.status='fulfilled';save();toast('Marked fulfilled.');rerender()},
 progCreate(){modal(modalHead('New welfare program')+'<div class="modal-b"><form onsubmit="return Act.progSave(event)"><div class="field"><label class="lbl">Title</label><input class="input" id="pr-t" required></div><div class="field"><label class="lbl">Category</label><select class="input" id="pr-c"><option>Food Distribution</option><option>Education Support</option><option>Women Empowerment</option><option>Elderly Support</option><option>Child Welfare</option><option>Disaster Relief</option><option>Community Development</option><option>Skill Development</option><option>Environmental Activities</option></select></div><div class="field"><label class="lbl">Description</label><textarea class="input" id="pr-d" required></textarea></div><button class="btn btn-p" style="width:100%;justify-content:center">Create program</button></form></div>',520)},
 progSave(ev){ev.preventDefault();if(!vform(ev.target))return false;API.createProgram({title:$('#pr-t').value,category:$('#pr-c').value,description:$('#pr-d').value});save();closeModal();toast('Program created.');rerender();return false},
 progDel(id){confirmBox({title:'End this program?',confirmText:'End program',danger:true}).then(ok=>{if(ok){DB.programs=DB.programs.filter(p=>p.id!==id);save();toast('Program ended.','info');rerender()}})},
 campCreate(){modal(modalHead('New donation campaign')+'<div class="modal-b"><form onsubmit="return Act.campSave(event)"><div class="field"><label class="lbl">Title</label><input class="input" id="cm-t" required></div><div class="f-row"><div class="field"><label class="lbl">Category</label><select class="input" id="cm-c"><option>Medical</option><option>Education</option><option>Food</option><option>Elderly Care</option><option>Emergency Relief</option><option>Child Welfare</option><option>General</option></select></div><div class="field"><label class="lbl">Target amount (₹)</label><input class="input" type="number" id="cm-tg" min="1000" value="100000" required></div></div><div class="field"><label class="lbl">Description</label><textarea class="input" id="cm-d" required placeholder="What will the funds be used for?"></textarea></div><button class="btn btn-p" style="width:100%;justify-content:center">Create campaign</button></form></div>',540)},
 campSave(ev){ev.preventDefault();if(!vform(ev.target))return false;API.createCampaign({title:$('#cm-t').value,category:$('#cm-c').value,target:+$('#cm-tg').value,description:$('#cm-d').value});save();closeModal();toast('Campaign created — citizens can now donate.');rerender();return false},
 storyCreate(){modal(modalHead('Publish success story')+'<div class="modal-b"><form onsubmit="return Act.storySave(event)"><div class="field"><label class="lbl">Title</label><input class="input" id="st-t" required></div><div class="field"><label class="lbl">Story</label><textarea class="input" id="st-b" required placeholder="What happened, who was helped, what changed?"></textarea></div><button class="btn btn-p" style="width:100%;justify-content:center">Publish</button></form></div>',520)},
 storySave(ev){ev.preventDefault();if(!vform(ev.target))return false;API.createStory({title:$('#st-t').value,body:$('#st-b').value});save();closeModal();toast('Story published — it may appear on the homepage.');rerender();return false},
 storyDel(id){confirmBox({title:'Delete this story?',confirmText:'Delete',danger:true}).then(ok=>{if(ok){DB.stories=DB.stories.filter(s=>s.id!==id);save();toast('Story deleted.','info');rerender()}})},
 reqCreate(){modal(modalHead('Publish donation requirement')+'<div class="modal-b"><form onsubmit="return Act.reqSave(event)"><div class="field"><label class="lbl">Item</label><input class="input" id="rq-i" placeholder="e.g. Wheelchairs, Food grains kit" required></div><div class="f-row"><div class="field"><label class="lbl">Category</label><select class="input" id="rq-c"><option>Food</option><option>Medicines</option><option>Clothing</option><option>Equipment</option><option>Education</option><option>Hygiene</option><option>Financial support</option><option>Other</option></select></div><div class="field"><label class="lbl">Quantity needed</label><input class="input" type="number" id="rq-q" min="1" value="10" required></div></div><div class="f-row"><div class="field"><label class="lbl">Urgency</label><select class="input" id="rq-u"><option>High</option><option>Normal</option></select></div><div class="field"><label class="lbl">Note</label><input class="input" id="rq-n" placeholder="Details for donors"></div></div><button class="btn btn-p" style="width:100%;justify-content:center">Publish requirement</button></form></div>',520)},
 reqSave(ev){ev.preventDefault();if(!vform(ev.target))return false;API.submitRequirement({item:$('#rq-i').value,category:$('#rq-c').value,qty:+$('#rq-q').value,urgency:$('#rq-u').value,note:$('#rq-n').value});save();closeModal();toast('Requirement published.');rerender();return false},
 reqFulfill(id){const r=DB.requirements.find(x=>x.id===id);r.status='fulfilled';save();toast('Requirement marked fulfilled.');rerender()},
 pledge(id){if(!me()){toast('Please sign in to pledge.','info');location.hash='#/login';return}const r=DB.requirements.find(x=>x.id===id);
  modal(modalHead('Offer help — '+h(r.item))+'<div class="modal-b"><p style="font-size:13px;color:var(--muted);margin-bottom:12px">'+h((orgById(r.orgId)||{}).name||'')+' needs '+r.qty+' · '+h(r.note||'')+'</p><form onsubmit="return Act.pledgeSubmit(event,\''+id+'\')"><div class="field"><label class="lbl">Quantity you pledge</label><input class="input" type="number" id="pl-q" min="1" max="'+r.qty+'" value="1" required></div><div class="field"><label class="lbl">Note (optional)</label><input class="input" id="pl-n" placeholder="e.g. Can deliver this weekend"></div><button class="btn btn-b" style="width:100%;justify-content:center"><i data-lucide="package" class="i"></i>Send pledge</button></form></div>',480)},
 pledgeSubmit(ev,id){ev.preventDefault();API.pledge(id,{qty:+$('#pl-q').value,note:$('#pl-n').value});save();closeModal();toast('Pledge sent — the organization will contact you.');return false},
 /* children + adoption */
 childAdd(id){const k=id?DB.children.find(c=>c.id===id):null;
  modal(modalHead(k?'Edit child profile':'Add child profile')+'<div class="modal-b"><form onsubmit="return Act.childSave(event,'+(k?'\''+k.id+'\'':'null')+')"><div class="f-row"><div class="field"><label class="lbl">Anonymous ID / first name</label><input class="input" id="ch-a" value="'+(k?h(k.alias):'')+'" placeholder="e.g. Aarohi (AN-07)" required></div><div class="field"><label class="lbl">Age</label><input class="input" type="number" id="ch-age" min="1" max="17" value="'+(k?k.age:8)+'" required></div></div><div class="field"><label class="lbl">Interests (comma separated — public)</label><input class="input" id="ch-int" value="'+(k?h(k.interests):'')+'" required></div><div class="field"><label class="lbl">Education level (public)</label><input class="input" id="ch-edu" value="'+(k?h(k.education):'')+'" required></div><div class="field"><label class="lbl">General need (public)</label><input class="input" id="ch-need" value="'+(k?h(k.needs):'')+'" required></div><div class="locked"><i data-lucide="lock" class="i-s" style="flex-shrink:0"></i><div>Full name, DOB, documents and case notes must stay offline / in your records — they are never published on HFE.</div></div><button class="btn btn-p" style="width:100%;justify-content:center;margin-top:14px">'+(k?'Save changes':'Add profile')+'</button></form></div>',540)},
 childSave(ev,id){ev.preventDefault();if(!vform(ev.target))return false;
  const d={alias:$('#ch-a').value,age:+$('#ch-age').value,interests:$('#ch-int').value,education:$('#ch-edu').value,needs:$('#ch-need').value};
  if(id){Object.assign(DB.children.find(c=>c.id===id),d);alog('Updated child profile',d.alias)}else{const o=myOrg();DB.children.push({id:uid(),orgId:o.id,hue:Math.floor(Math.random()*360),status:'available',full_name:'[Confidential record]',dob:null,case_notes:'Confidential — staff & admin only.',guardian:'Legal guardianship held by the orphanage under child welfare committee oversight.',...d});alog('Added child profile',d.alias)}
  save();closeModal();toast('Child profile saved.');rerender();return false},
 childStatus(id){const k=DB.children.find(c=>c.id===id);k.status='in_process';save();toast('Marked as adoption in process — hidden from public interest.','info');rerender()},
 interest(childId){if(!me()){toast('Please sign in to express adoption interest.','info');location.hash='#/login';return}const ch=DB.children.find(c=>c.id===childId);const o=orgById(ch.orgId);
  modal(modalHead('Adoption interest — '+h(ch.alias))+'<div class="modal-b"><form onsubmit="return Act.interestSubmit(event,\''+childId+'\')"><p style="font-size:13px;color:var(--muted);margin-bottom:12px">'+h(o.name)+' will review your application. This begins a careful, multi-stage process — not an instant approval.</p>'+
  '<div class="f-row"><div class="field"><label class="lbl">Co-applicant (spouse, if any)</label><input class="input" id="ad-sp" placeholder="Full name or -"></div><div class="field"><label class="lbl">Contact phone</label><input class="input" id="ad-ph" value="'+h(me().phone||'')+'" required></div></div>'+
  '<div class="field"><label class="lbl">Address</label><input class="input" id="ad-addr" required></div>'+
  '<div class="f-row"><div class="field"><label class="lbl">Occupation</label><input class="input" id="ad-occ" required></div><div class="field"><label class="lbl">Annual income</label><input class="input" id="ad-inc" placeholder="e.g. ₹10,00,000 / year"></div></div>'+
  '<div class="f-row"><div class="field"><label class="lbl">Household</label><input class="input" id="ad-hh" placeholder="e.g. 3 members — own home" required></div><div class="field"><label class="lbl">Other children</label><input class="input" id="ad-oc" placeholder="None"></div></div>'+
  '<div class="field"><label class="lbl">Preferred age range</label><input class="input" id="ad-age" placeholder="e.g. 5-10 years"></div>'+
  '<div class="field"><label class="lbl">Motivation</label><textarea class="input" id="ad-mot" required placeholder="Tell the orphanage about your family and why you wish to adopt."></textarea></div>'+
  '<div class="field"><label class="lbl">Documents you can provide</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">'+['Identity proof','Address proof','Income statement','Medical fitness certificate','Home study report'].map(d=>'<label class="check"><input type="checkbox" class="ad-doc" value="'+d+'"> '+d+'</label>').join('')+'</div></div>'+
  '<div class="disclaimer" style="margin:12px 0"><i data-lucide="alert-triangle" class="i-s" style="flex-shrink:0"></i><div>'+ADOPT_DISCLAIMER+'</div></div>'+
  '<label class="check" style="margin-bottom:14px"><input type="checkbox" id="ad-ok" required>I understand HFE does not replace legal adoption authorities.</label>'+
  '<button class="btn btn-p" style="width:100%;justify-content:center"><i data-lucide="file-text" class="i"></i>Submit application</button></form></div>',580)},
 interestSubmit(ev,childId){ev.preventDefault();if(!vform(ev.target))return false;if(!$('#ad-ok').checked){toast('Please acknowledge the legal disclaimer.','error');return false}
  const docs=$$('.ad-doc').filter(c=>c.checked).map(c=>c.value);
  API.submitAdoption(childId,{spouse:$('#ad-sp').value||'-',phone:$('#ad-ph').value,address:$('#ad-addr').value,occupation:$('#ad-occ').value,income:$('#ad-inc').value,household:$('#ad-hh').value,otherChildren:$('#ad-oc').value||'None',motivation:$('#ad-mot').value,agePref:$('#ad-age').value||'-',docs:docs});
  save();closeModal();toast('Application submitted — track it under My Requests.');return false},
 adopSet(id,st){if(st==='Completed'){confirmBox({title:'Mark adoption as completed?',message:'Only do this after the legal process with the authorities is fully finished. The applicants will be notified.',confirmText:'Mark completed',danger:true}).then(ok=>{if(ok){API.setAdoption(id,'Completed','Legal process completed with authorities.');save();toast('Adoption marked completed.');rerender()}});return}
  API.setAdoption(id,st);save();toast('Status updated — the applicants have been notified.');rerender()},
 adopReject(id){promptBox({title:'Reject adoption application',message:'Add a short reason — it is shared with the applicants, who may reapply.',label:'Reason',ok:'Reject application'}).then(v=>{if(v!==null){API.setAdoption(id,'Rejected',v||'');save();toast('Application rejected.','info');rerender()}})},
 adopMeet(id){modal(modalHead('Schedule interview / home meeting')+'<div class="modal-b"><form onsubmit="return Act.adopMeetSave(event,\''+id+'\')"><div class="field"><label class="lbl">Date & time</label><input class="input" type="datetime-local" id="am-when" required></div><div class="field"><label class="lbl">Note for applicants</label><input class="input" id="am-note" placeholder="e.g. Home visit — both applicants should be present"></div><button class="btn btn-b" style="width:100%;justify-content:center"><i data-lucide="calendar-clock" class="i"></i>Schedule & notify</button></form></div>',500)},
 adopMeetSave(ev,id){ev.preventDefault();if(!vform(ev.target))return false;const when=$('#am-when').value;API.setAdoption(id,'Interview Scheduled',$('#am-note').value,when);save();closeModal();toast('Interview scheduled — applicants notified.');rerender();return false}
};

/* ============ router + boot ============ */
function rerender(){render(true)}
function revealInit(){const els=$$('.reveal');if(!els.length||!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('in'));return}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});els.forEach(el=>io.observe(el))}
function initCountUps(){if(!('IntersectionObserver'in window))return;const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target._done){e.target._done=true;const t=parseFloat(e.target.dataset.n),st=performance.now();const step=ts=>{const p=Math.min(1,(ts-st)/1200),v=Math.round(t*(1-Math.pow(1-p,3)));e.target.textContent=v.toLocaleString('en-IN')+'+';if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)}}),{threshold:.4});$$('[data-n]').forEach(el=>io.observe(el))}
function bellList(){const ns=API.myNotis().slice(0,6);if(!ns.length)return '<div style="padding:24px;text-align:center;color:var(--muted)"><i data-lucide="bell" class="i-l"></i><p style="margin-top:8px;font-size:13px">No notifications yet</p></div>';
 return '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line)"><b style="font:700 13px \'Public Sans\'">Notifications</b><button class="btn btn-g btn-xs" onclick="Act.readAll()">Mark all read</button></div>'+ns.map(n=>'<div class="pop-i" style="align-items:flex-start;'+(n.read?'':'background:#FBF7EF')+'"><div class="noti-i"><i data-lucide="'+(n.icon||'bell')+'" class="i-s"></i></div><div><b style="font-size:13px">'+h(n.title)+'</b><p style="font-size:12.5px;color:var(--muted)">'+h(n.message)+'</p><span style="font-size:11px;color:var(--muted)">'+ago(n.at)+'</span></div></div>').join('')+'<div style="padding:7px;text-align:center"><button class="btn btn-g btn-xs" onclick="go(\'#/p/notifications\');document.querySelectorAll(\'.pop\').forEach(p=>p.classList.remove(\'open\'))">View all</button></div>'}
function render(keepScroll){try{CHARTS.forEach(c=>{try{c.destroy()}catch(e){}});CHARTS=[];if(!keepScroll)window.scrollTo(0,0);
 const route=location.hash.replace(/^#\/?/,'');const parts=route.split('/');const seg=parts[0]||'home',arg=parts[1];
 if(seg==='p'){if(!me()){toast('Please sign in to continue.','info');location.hash='#/login';return}renderPortal(arg);return}
 const map={home:vHome,about:vAbout,services:vServices,orgs:vOrgs,org:vOrgDetail,events:vEvents,event:vEventDetail,donations:vDonations,volunteer:vVolunteer,nearme:vNearMe,feedback:vFeedback,login:vLogin,register:vRegister};
 const fn=map[seg]||v404;
 $('#app').innerHTML=fn(arg);icons();revealInit();initCountUps();wireSearch();
}catch(err){console.error(err);$('#app').innerHTML='<div style="padding:60px 20px;text-align:center"><h2 style="font-family:Fraunces">Something went wrong</h2><p style="color:var(--muted);margin-top:8px">'+h(String(err))+'</p><button class="btn btn-p" style="margin-top:16px" onclick="resetDemo()">Reset demo data & reload</button></div>'}
finally{const s=$('#splash');if(s){s.style.opacity='0';setTimeout(()=>{if(s.parentNode)s.parentNode.removeChild(s)},450)}}}
window.addEventListener('hashchange',()=>render());
function boot(){try{loadDB();loadSession();render();if(store._memory)setTimeout(function(){toast('Sandbox preview mode: data lives in memory and resets on reload. Open the file directly in a browser for persistence.','info')},2000)}catch(err){console.error(err);$('#app').innerHTML='<div style="padding:60px 20px;text-align:center"><h2>HFE failed to start</h2><pre style="color:var(--red)">'+h(String(err))+'</pre><button class="btn btn-p" style="margin-top:14px" onclick="resetDemo()">Reset demo data & reload</button></div>'}finally{const s=$('#splash');if(s){s.style.opacity='0';setTimeout(()=>{if(s.parentNode)s.parentNode.removeChild(s)},450)}}}
boot();
</script>
